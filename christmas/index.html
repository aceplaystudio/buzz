:root { --bg0: #03100c; --cream: #fbf3e4; --gold: #f0c35a; --gold-soft: #ffe7a6; --ruby: #d02a42; --muted: rgba(251,243,228,.62); --hair: rgba(240,205,130,.2); --hair-2: rgba(240,205,130,.42); --tc: #d02a42;
  --foil: linear-gradient(135deg, #9b6b1c 0%, #f6dc8c 22%, #c99630 44%, #fff0b5 60%, #b8842a 80%, #ecc86c 100%); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: radial-gradient(ellipse 90% 50% at 50% -5%, rgba(255, 214, 120, .16), transparent 60%), radial-gradient(circle at 50% 0%, #17533e, #0b2e24 50%, var(--bg0)); background-attachment: fixed; color: var(--cream); font-family: 'Fredoka', 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 18px; -webkit-font-smoothing: antialiased; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
.app { min-height: 100%; display: flex; flex-direction: column; align-items: center; padding: max(18px, env(safe-area-inset-top)) 18px max(16px, env(safe-area-inset-bottom)); gap: 14px; }
.top { text-align: center; }
.top .small { font-size: 12px; font-weight: 600; color: var(--gold-soft); letter-spacing: .3em; }
.top .big { font-size: 34px; font-weight: 700; line-height: 1.05; background: var(--foil); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 #5a0a18); }
.screen { flex: 1; width: 100%; max-width: 440px; display: flex; flex-direction: column; justify-content: center; gap: 14px; text-align: center; }
.hidden { display: none !important; }
h1 { font-size: 26px; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); font-size: 15px; }
input { width: 100%; font: inherit; font-size: 22px; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--hair-2); background: rgba(0,0,0,.35); color: var(--cream); text-align: center; outline: none; box-shadow: inset 0 2px 8px rgba(0,0,0,.35); }
input:focus { border-color: var(--gold); box-shadow: inset 0 2px 8px rgba(0,0,0,.35), 0 0 0 3px rgba(240,195,90,.25); }
.btn { font: inherit; font-weight: 600; font-size: 20px; padding: 15px 18px; border-radius: 16px; border: 1px solid var(--hair); background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)), rgba(10,40,31,.9); color: var(--cream); cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 8px 18px -10px rgba(0,0,0,.7); }
.btn.primary { background: var(--foil); color: #2b1a05; border-color: rgba(255,236,170,.9); text-shadow: 0 1px 0 rgba(255,255,255,.35); box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 12px 26px -10px rgba(240,195,90,.75); }
.btn:disabled { opacity: .4; }
.teams { display: grid; gap: 10px; }
/* Plain colours first: older phones (iOS 15) skip the colour-mix() lines below and use these. */
.team { border-color: var(--c); background: rgba(0,0,0,.3); }
.team.on { background: var(--c); }
.who { background: var(--tc); }
.buzz { background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.45), var(--tc) 52%) padding-box, var(--foil) border-box; box-shadow: 0 14px 0 rgba(0,0,0,.45), 0 24px 50px rgba(0,0,0,.55), inset 0 6px 14px rgba(255,255,255,.25); }
.buzz:active, .buzz.pressed { box-shadow: 0 4px 0 rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.5), inset 0 6px 14px rgba(255,255,255,.25); }
.team { border-color: color-mix(in srgb, var(--c) 70%, transparent); background: linear-gradient(160deg, color-mix(in srgb, var(--c) 30%, transparent), rgba(0,0,0,.25)); }
.team.on { background: linear-gradient(180deg, color-mix(in srgb, var(--c) 90%, #fff 8%), color-mix(in srgb, var(--c) 65%, #000)); border-color: #ffe9a8; box-shadow: 0 0 0 3px rgba(240,195,90,.4), 0 10px 26px -8px var(--c); }
.who { display: inline-block; padding: 7px 18px; border-radius: 20px; background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 90%, #fff 6%), color-mix(in srgb, var(--tc) 65%, #000)); border: 1px solid rgba(255,230,160,.5); font-weight: 600; }
.buzz { position: relative; width: min(78vw, 340px); aspect-ratio: 1; margin: 6px auto; border-radius: 50%; border: 10px solid transparent; background: radial-gradient(circle at 35% 28%, color-mix(in srgb, var(--tc) 50%, #fff), var(--tc) 52%, color-mix(in srgb, var(--tc) 55%, #000)) padding-box, var(--foil) border-box; color: #fff; font: inherit; font-size: 64px; font-weight: 700; letter-spacing: .04em; text-shadow: 0 4px 0 rgba(0,0,0,.3); box-shadow: 0 14px 0 color-mix(in srgb, var(--tc) 40%, #000), 0 24px 50px rgba(0,0,0,.55), inset 0 6px 14px rgba(255,255,255,.25); touch-action: manipulation; cursor: pointer; transition: transform .06s, box-shadow .06s; }
.buzz.armed { animation: glow 1.2s ease-in-out infinite; }
.buzz:active, .buzz.pressed { transform: translateY(10px); box-shadow: 0 4px 0 color-mix(in srgb, var(--tc) 40%, #000), 0 10px 30px rgba(0,0,0,.5), inset 0 6px 14px rgba(255,255,255,.25); }
.buzz.locked { filter: grayscale(.85) brightness(.6); animation: none; }
.buzz.first { --tc: #e8a317; animation: none; }
@keyframes glow { 50% { box-shadow: 0 14px 0 color-mix(in srgb, var(--tc) 40%, #000), 0 0 70px 14px color-mix(in srgb, var(--tc) 65%, transparent), inset 0 6px 14px rgba(255,255,255,.25); } }
.msg { font-size: 24px; font-weight: 600; min-height: 1.3em; }
.msg.win { font-size: 32px; color: var(--gold); text-shadow: 0 0 24px rgba(240,195,90,.45); }
.link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 8px; }
.spinner { width: 46px; height: 46px; margin: 0 auto; border-radius: 50%; border: 5px solid rgba(251,243,228,.15); border-top-color: var(--gold); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.foot { font-size: 12px; color: var(--muted); text-align: center; }
/* very long one-word names wrap instead of pushing the page sideways */
.team, .who, .msg { overflow-wrap: anywhere; }
.who { max-width: 100%; }
/* phone turned sideways: the button must fit the short screen */
@media (orientation: landscape) and (max-height: 520px) { .buzz { width: min(46vh, 50vw); font-size: 38px; border-width: 7px; margin: 0 auto; } .app { gap: 6px; padding-top: max(8px, env(safe-area-inset-top)); } .screen { gap: 6px; } .app:has(#s-buzz:not(.hidden)) .top { display: none; } .who { font-size: 14px; padding: 4px 12px; } .msg { font-size: 18px; min-height: 0; } .msg.win { font-size: 22px; } .link { padding: 2px; } }
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="small">FAMILY HOLIDAY</div><div class="big">Showdown</div></div>

  <div class="screen" id="s-code">
    <h1>Phone buzzer</h1>
    <p class="muted">Type the game code from the TV or the host's screen.</p>
    <input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC234">
    <button class="btn primary" id="go">Connect</button>
    <p class="muted" id="code-err"></p>
  </div>

  <div class="screen hidden" id="s-wait">
    <div class="spinner"></div>
    <h1 id="wait-title">Connecting to the game…</h1>
    <p class="muted" id="wait-text">Make sure you have internet (Wi-Fi or mobile data).</p>
    <button class="link" id="wait-code">Enter a different code</button>
  </div>

  <div class="screen hidden" id="s-join">
    <h1>Join the game</h1>
    <input id="name" maxlength="20" autocomplete="off" placeholder="Your name">
    <p class="muted">Pick your team</p>
    <div class="teams" id="teams"></div>
    <button class="btn primary" id="join" disabled>Join</button>
  </div>

  <div class="screen hidden" id="s-buzz">
    <div><span class="who" id="who"></span></div>
    <button class="buzz locked" id="buzz" aria-label="Buzz">BUZZ</button>
    <div class="msg" id="msg">Get ready…</div>
    <button class="link" id="change">Change name or team</button>
  </div>

  <div class="foot">Buzzes go straight to the host's game. No account, nothing to install.</div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } }
  };
  var pid = store.get('fhsb.pid');
  if (!pid) { pid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); store.set('fhsb.pid', pid); }

  var code = '', peer = null, conn = null, last = null, team = -1, wantJoin = false, retryT = null, slowT = null, hostOff = false;
  var myName = store.get('fhsb.name') || '';
  var savedTeamRaw = store.get('fhsb.team');
  var savedTeam = savedTeamRaw === '0' ? 0 : savedTeamRaw === '1' ? 1 : -1; // no team picked yet = none selected
  $('name').value = myName;

  function show(id) {
    ['s-code', 's-wait', 's-join', 's-buzz'].forEach(function (s) { $(s).classList.toggle('hidden', s !== id); });
  }
  function clean(c) { return String(c || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
  // Game codes never use o, i, l, 0 or 1 (easy to mix up).
  function validCode(c) { return /^[a-hjkmnp-z2-9]{6}$/.test(c); }

  // "Still trying…" hint: one timer per code, not reset by every retry.
  function slowHint() {
    clearTimeout(slowT);
    slowT = setTimeout(function () {
      if (hostOff) return;
      $('wait-title').textContent = 'Still trying…';
      $('wait-text').textContent = 'Check the code, and ask the host to turn on phone buzzers (it needs internet on their computer too).';
    }, 12000);
  }

  function start(c) {
    if (conn) { var old = conn; conn = null; try { old.close(); } catch (e) { /* ignore */ } }
    code = c;
    hostOff = false;
    try { history.replaceState(null, '', '#' + c); } catch (e) { /* ignore */ }
    $('wait-title').textContent = 'Connecting to the game…';
    $('wait-text').textContent = 'Make sure you have internet (Wi-Fi or mobile data).';
    show('s-wait');
    slowHint();
    connect();
  }

  function connect() {
    clearTimeout(retryT);
    if (typeof Peer !== 'function') { $('wait-text').textContent = 'This browser can’t run the buzzer. Try Chrome or Safari.'; return; }
    if (!peer || peer.destroyed) {
      peer = new Peer({ debug: 0 });
      peer.on('open', openConn);
      peer.on('error', function (err) {
        if (err && err.type === 'peer-unavailable') { $('wait-title').textContent = 'Game not found yet…'; }
        retry();
      });
      peer.on('disconnected', function () { try { peer.reconnect(); } catch (e) { retry(); } });
    } else if (peer.open) {
      openConn();
    } else if (peer.disconnected) {
      try { peer.reconnect(); } catch (e) { peer.destroy(); retry(); }
    }
  }

  function openConn() {
    if (conn) { try { conn.close(); } catch (e) { /* ignore */ } }
    var c = peer.connect('fhs-' + code, { reliable: true });
    conn = c;
    c.on('open', function () { clearTimeout(slowT); });
    c.on('data', function (m) { if (c === conn) onMsg(m); });
    c.on('close', function () { if (c === conn) lost(); });
    c.on('error', function () { if (c === conn) lost(); });
  }

  function lost() {
    conn = null;
    if (!code) return;
    // keep "The host turned off phone buzzers" on screen instead of "Reconnecting…"
    if (!hostOff) { $('wait-title').textContent = 'Reconnecting…'; slowHint(); }
    show('s-wait');
    retry();
  }
  function retry() {
    clearTimeout(retryT);
    retryT = setTimeout(function () { if (code) connect(); }, 3000);
  }
  function send(m) { try { if (conn && conn.open) { conn.send(m); return true; } } catch (e) { /* ignore */ } return false; }

  function onMsg(m) {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'bye') { hostOff = true; clearTimeout(slowT); $('wait-title').textContent = 'The host turned off phone buzzers.'; $('wait-text').textContent = 'Waiting… this page reconnects by itself.'; show('s-wait'); return; }
    if (m.t !== 'state' || !Array.isArray(m.teams)) return;
    hostOff = false;
    clearTimeout(slowT);
    last = m;
    if (!m.joined) {
      // after a reconnect, join again by ourselves
      if (wantJoin && myName && (team === 0 || team === 1)) { send({ t: 'join', pid: pid, name: myName, team: team }); return; }
      drawTeams(m.teams);
      show('s-join');
      return;
    }
    wantJoin = true;
    team = m.team;
    var t = m.teams[m.team] || { name: '', color: '#d42a3a' };
    document.documentElement.style.setProperty('--tc', t.color);
    $('who').textContent = m.name + ' · ' + t.name;
    var b = $('buzz'), msg = $('msg');
    b.classList.remove('pressed');
    b.classList.toggle('armed', !!m.armed);
    b.classList.toggle('locked', !m.armed && !(m.winner && m.winner.you));
    b.classList.toggle('first', !!(m.winner && m.winner.you));
    msg.className = 'msg';
    if (m.winner && m.winner.you) { msg.textContent = 'You were first! 🎉'; msg.className = 'msg win'; b.textContent = '1st'; }
    else if (m.winner) { msg.textContent = m.winner.name + ' was first'; b.textContent = 'BUZZ'; }
    else if (m.armed) { msg.textContent = m.phase === 'setup' ? 'Test your buzzer!' : 'Buzz when you know it!'; b.textContent = 'BUZZ'; }
    else { msg.textContent = m.phase === 'setup' ? 'Waiting for the game to start…' : 'Wait for the next face-off…'; b.textContent = 'BUZZ'; }
    show('s-buzz');
  }

  function drawTeams(teams) {
    var box = $('teams');
    box.innerHTML = '';
    if (team !== 0 && team !== 1 && (savedTeam === 0 || savedTeam === 1)) team = savedTeam;
    teams.forEach(function (t, i) {
      var b = document.createElement('button');
      b.className = 'btn team' + (i === team ? ' on' : '');
      b.style.setProperty('--c', t.color);
      b.textContent = t.name;
      b.addEventListener('click', function () { team = i; drawTeams(teams); });
      box.appendChild(b);
    });
    checkJoin();
  }
  function checkJoin() { $('join').disabled = !($('name').value.trim() && (team === 0 || team === 1)); }

  $('name').addEventListener('input', checkJoin);
  $('join').addEventListener('click', function () {
    myName = $('name').value.trim().slice(0, 20);
    if (!myName || (team !== 0 && team !== 1)) return;
    store.set('fhsb.name', myName);
    store.set('fhsb.team', String(team));
    wantJoin = true;
    send({ t: 'join', pid: pid, name: myName, team: team });
  });
  $('change').addEventListener('click', function () {
    wantJoin = false;
    send({ t: 'leave' });
    if (last) { drawTeams(last.teams); show('s-join'); }
  });

  function buzz(e) {
    if (e) e.preventDefault();
    var b = $('buzz');
    if (!b.classList.contains('armed')) return;
    b.classList.add('pressed');
    try { if (navigator.vibrate) navigator.vibrate(80); } catch (err) { /* ignore */ }
    if (!send({ t: 'buzz', pid: pid })) lost();
  }
  $('buzz').addEventListener('pointerdown', buzz);
  $('buzz').addEventListener('click', function (e) { e.preventDefault(); });

  function goCode() {
    var c = clean($('code').value);
    if (!validCode(c)) { $('code-err').textContent = 'The code has 6 letters and numbers, like ABC234. Codes never use O, I, L, 0 or 1.'; return; }
    $('code-err').textContent = '';
    start(c);
  }
  $('go').addEventListener('click', goCode);
  $('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') goCode(); });
  $('wait-code').addEventListener('click', function () { code = ''; clearTimeout(retryT); show('s-code'); });

  // Phones sleep: reconnect when the page comes back.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && code && !(conn && conn.open)) connect();
    if (document.visibilityState === 'visible' && 'wakeLock' in navigator) navigator.wakeLock.request('screen').catch(function () {});
  });
  if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(function () {});

  // A new QR code / link opened in the same tab only changes the #code: connect to the new game.
  window.addEventListener('hashchange', function () {
    var c = clean(location.hash);
    if (validCode(c) && c !== code) start(c);
  });

  var fromHash = clean(location.hash);
  if (validCode(fromHash)) start(fromHash); else show('s-code');
})();
</script>
</body>
